<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 라면 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFD23F;
    --ink: #1C1208;
    --paper: #FFFFFF;
    --muted: #6B5A3E;
    --line: #1C1208;
    --shin: #D7141A;
    --bibim: #E8641B;
    --jjapa: #2B1A10;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2A2110;
      --ink: #FFF4D6;
      --paper: #1A1408;
      --muted: #C9B98F;
      --line: #FFD23F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2A2110;
    --ink: #FFF4D6;
    --paper: #1A1408;
    --muted: #C9B98F;
    --line: #FFD23F;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 30rem;
    padding: 2.5rem 1.25rem 3rem;
  }
  h1 {
    font-family: "Black Han Sans", "Apple SD Gothic Neo", sans-serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 3.6rem);
    line-height: 1.05;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }
  .lede { margin: 0 0 2rem; color: var(--muted); }

  .q {
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 18px;
    padding: 1.25rem 1.25rem 1.1rem;
    margin-bottom: 1rem;
    box-shadow: 5px 5px 0 var(--line);
  }
  .q[hidden] { display: none; }
  .q.appear { animation: drop 0.28s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
  .q p { margin: 0 0 0.9rem; font-size: 1.25rem; font-weight: 700; }
  .choices { display: flex; gap: 0.6rem; }
  .choices button {
    flex: 1;
    font: inherit;
    font-size: 1.05rem;
    padding: 0.7rem 0.5rem;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .choices button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }
  button:focus-visible { outline: 3px solid var(--shin); outline-offset: 3px; }

  .result {
    margin-top: 1.75rem;
    border-radius: 22px;
    padding: 1.75rem 1.5rem 1.5rem;
    color: #fff;
    position: relative;
    overflow: hidden;
    border: 3px solid var(--line);
  }
  .result[hidden] { display: none; }
  .result.appear { animation: pop 0.35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: scale(0.92); } }
  .result small { font-size: 0.95rem; opacity: 0.85; }
  .result .name {
    display: block;
    font-family: "Black Han Sans", "Apple SD Gothic Neo", sans-serif;
    font-size: clamp(3rem, 15vw, 4.5rem);
    line-height: 1.05;
    margin: 0.25rem 0 0.5rem;
  }
  .result .why { margin: 0 0 1.25rem; }
  .result .bowl {
    position: absolute;
    right: -0.5rem;
    bottom: -1rem;
    font-size: 6rem;
    opacity: 0.25;
    pointer-events: none;
  }
  .result.shin { background: var(--shin); }
  .result.bibim { background: var(--bibim); }
  .result.jjapa { background: var(--jjapa); }
  .reset {
    font: inherit;
    background: #fff;
    color: #1C1208;
    border: 0;
    border-radius: 999px;
    padding: 0.55rem 1.1rem;
    cursor: pointer;
    position: relative;
  }

  details {
    margin-top: 2.25rem;
    font-size: 0.95rem;
    color: var(--muted);
  }
  summary { cursor: pointer; }
  pre {
    overflow-x: auto;
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 0.9rem;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  @media (prefers-reduced-motion: reduce) {
    .q.appear, .result.appear { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>오늘은<br>무슨 라면?</h1>
  <p class="lede">두 가지만 답하면 골라드릴게요.</p>

  <section class="q" id="q-soup">
    <p>국물이 있나요?</p>
    <div class="choices">
      <button type="button" data-q="soup" data-v="yes" aria-pressed="false">네, 국물파</button>
      <button type="button" data-q="soup" data-v="no" aria-pressed="false">아니요</button>
    </div>
  </section>

  <section class="q" id="q-summer" hidden>
    <p>여름인가요?</p>
    <div class="choices">
      <button type="button" data-q="summer" data-v="yes" aria-pressed="false">네, 더워요</button>
      <button type="button" data-q="summer" data-v="no" aria-pressed="false">아니요</button>
    </div>
  </section>

  <section class="result" id="result" hidden aria-live="polite">
    <small>추천 라면</small>
    <span class="name" id="ramen-name"></span>
    <p class="why" id="ramen-why"></p>
    <button type="button" class="reset" id="reset">다시 고르기</button>
    <span class="bowl" aria-hidden="true">🍜</span>
  </section>

  <details>
    <summary>판단 로직 보기</summary>
<pre>if (hasSoup) {
    ramen = "신라면";
} else if (isSummer) {
    ramen = "진비빔면";
} else {
    ramen = "짜파게티";
}</pre>
  </details>
</main>

<script>
  const state = { soup: null, summer: null };
  const qSummer = document.getElementById('q-summer');
  const result = document.getElementById('result');
  const nameEl = document.getElementById('ramen-name');
  const whyEl = document.getElementById('ramen-why');

  const RAMEN = {
    shin:  { name: '신라면',   why: '얼큰한 국물이 당길 땐 역시 이거죠.' },
    bibim: { name: '진비빔면', why: '더운 날엔 차갑게 비벼 먹는 게 최고예요.' },
    jjapa: { name: '짜파게티', why: '국물 없이, 계절 상관없이 든든하게.' }
  };

  function reveal(el) {
    el.hidden = false;
    el.classList.remove('appear');
    void el.offsetWidth;
    el.classList.add('appear');
  }

  function decide() {
    let key = null;
    if (state.soup === true) key = 'shin';
    else if (state.soup === false && state.summer === true) key = 'bibim';
    else if (state.soup === false && state.summer === false) key = 'jjapa';

    if (!key) { result.hidden = true; return; }
    result.className = 'result ' + key;
    nameEl.textContent = RAMEN[key].name;
    whyEl.textContent = RAMEN[key].why;
    reveal(result);
    console.log(`추천 라면: ${RAMEN[key].name}`);
  }

  document.querySelectorAll('.choices button').forEach(btn => {
    btn.addEventListener('click', () => {
      const q = btn.dataset.q;
      const v = btn.dataset.v === 'yes';
      state[q] = v;
      btn.parentElement.querySelectorAll('button').forEach(b =>
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));

      if (q === 'soup') {
        if (v) {
          // 국물이 있으면 여름 여부와 상관없이 결정됨
          qSummer.hidden = true;
        } else if (qSummer.hidden) {
          state.summer = null;
          qSummer.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));
          reveal(qSummer);
        }
      }
      decide();
    });
  });

  document.getElementById('reset').addEventListener('click', () => {
    state.soup = null; state.summer = null;
    document.querySelectorAll('.choices button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    qSummer.hidden = true;
    result.hidden = true;
    document.querySelector('#q-soup button').focus();
  });
</script>
</body>
</html>
